name: Pdf2Podcast
options:
  bundleIdPrefix: io.pdf2podcast
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Pdf2Podcast:
    type: application
    platform: iOS
    sources:
      - path: Pdf2Podcast
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: Pdf2PodcastShare
        embed: true
    entitlements:
      path: Pdf2Podcast/Pdf2Podcast.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.pdf2podcast.mobile
    info:
      path: Pdf2Podcast/Info.plist
      properties:
        CFBundleDisplayName: Pdf2Podcast
        Pdf2PodcastSharedKeychainGroup: $(AppIdentifierPrefix)io.pdf2podcast.mobile
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSTemporaryExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pdf2podcast.mobile
        PRODUCT_NAME: Pdf2Podcast
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  Pdf2PodcastShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Pdf2PodcastShare
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: Pdf2PodcastShare/Info.plist
      properties:
        CFBundleDisplayName: Pdf2Podcast
        Pdf2PodcastSharedKeychainGroup: $(AppIdentifierPrefix)io.pdf2podcast.mobile
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSTemporaryExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR
              ANY $attachment.registeredTypeIdentifiers == "public.data"
              ).@count >= 1).@count >= 1
    entitlements:
      path: Pdf2PodcastShare/Pdf2PodcastShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.pdf2podcast.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pdf2podcast.mobile.share
        PRODUCT_NAME: Pdf2PodcastShare
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  Pdf2PodcastIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Pdf2PodcastIOSTests
    dependencies:
      - target: Pdf2Podcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pdf2podcast.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pdf2Podcast.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pdf2Podcast"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Pdf2Podcast:
    build:
      targets:
        Pdf2Podcast: all
        Pdf2PodcastIOSTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - Pdf2PodcastIOSTests
